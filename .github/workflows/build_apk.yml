name: Build Android APK
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Detect preinstalled Android SDK
        id: android-sdk
        shell: bash
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ -d "$sdk_root/cmdline-tools" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
            echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: android-actions/setup-android@v3
        if: steps.android-sdk.outputs.available != 'true'
      - name: Install Android platform
        shell: bash
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk_root"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          if [ ! -f "$sdk_root/platforms/android-35/android.jar" ] || [ ! -d "$sdk_root/build-tools/34.0.0" ]; then
            manager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
            bash .github/scripts/run_checked.sh env JAVA_HOME="${JAVA_HOME_21_X64:-$JAVA_HOME}" "$manager" "platforms;android-35" "build-tools;34.0.0"
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Ensure Gradle wrapper
        run: |
          if [ ! -f gradlew ] || [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.7 --distribution-type bin
          fi
          chmod +x gradlew
      - name: Test, lint and build
        run: bash .github/scripts/run_checked.sh ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace
      - name: Verify optimized release compiles
        run: bash .github/scripts/run_checked.sh ./gradlew assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: file-manager-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            app/build/reports/
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore
